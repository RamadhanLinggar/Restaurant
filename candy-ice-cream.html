<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Candy Ice Cream</title>
  <link rel="stylesheet" href="CSS/style.css" />
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">
      <a href="index.html"><img src="Gambar/Logo.png" alt="Logo" /></a>
    </div>
    <h1 class="page-title">Candy Ice Cream</h1>
  </header>

  <!-- Konten -->
  <section class="food-detail">
    <div class="food-image">
      <img src="Gambar/candy-ice-cream.jpg" alt="Candy Ice Cream" />
    </div>
    <div class="food-info">
      <h2>Candy Ice Cream</h2>
      <p>
        Es krim lembut dengan rasa vanila, cokelat, dan stroberi, dilengkapi potongan permen warna-warni.  
        Manis, segar, dan pastinya disukai semua kalangan.
      </p>
      <p style="color: red; font-weight: bold">Rp 27.000</p>

      <!-- Form Pemesanan -->
      <form action="pesan.php" method="POST" class="form-pesan">
        <input type="hidden" name="makanan" value="Candy Ice Cream">

        <label>Nama:</label>
        <input type="text" name="nama" placeholder="Nama Anda" required>

        <label>Jumlah:</label>
        <input type="number" name="jumlah" id="jumlah" min="1" value="1" required>

        <label>Total (Rp):</label>
        <input type="text" name="total" id="total" value="27.000" readonly>

        <button type="submit" class="btn-pesan">Pesan Sekarang</button>
      </form>
    </div>
  </section>

  <!-- JavaScript untuk menghitung total otomatis -->
  <script>
    // Harga satuan Candy Ice Cream
    const hargaSatuan = 27000;

    // Ambil elemen input
    const jumlahInput = document.getElementById("jumlah");
    const totalInput = document.getElementById("total");

    // Fungsi format rupiah (pakai titik)
    function formatRupiah(angka) {
      return angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    // Fungsi hitung total otomatis
    function updateTotal() {
      const jumlah = parseInt(jumlahInput.value) || 1;
      const total = hargaSatuan * jumlah;
      totalInput.value = formatRupiah(total);
    }

    // Jalankan saat jumlah berubah
    jumlahInput.addEventListener("input", updateTotal);
    updateTotal();
  </script>

  <script src="JS/restoran.js" defer></script>
</body>
</html>
