<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jus Alpukat</title>
  <link rel="stylesheet" href="CSS/style.css" />
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">
      <a href="index.html"><img src="Gambar/Logo.png" alt="Logo" /></a>
    </div>
    <h1 class="page-title">Jus Alpukat</h1>
  </header>

  <!-- Konten -->
  <section class="food-detail">
    <div class="food-image">
      <img src="Gambar/jus-alpukat.jpg" alt="Jus Alpukat" />
    </div>
    <div class="food-info">
      <h2>Jus Alpukat Spesial</h2>
      <p>
        Lembut, manis, dan penuh energi. Terbuat dari alpukat segar berkualitas dengan tambahan susu dan cokelat kental manis.
      </p>
      <p style="color: red; font-weight: bold">Rp 18.000</p>

      <!-- Form Pemesanan -->
      <form action="pesan.php" method="POST" class="form-pesan">
        <input type="hidden" name="makanan" value="Jus Alpukat Spesial">

        <label>Nama:</label>
        <input type="text" name="nama" placeholder="Nama Anda" required>

        <label>Jumlah:</label>
        <input type="number" name="jumlah" id="jumlah" min="1" value="1" required>

        <label>Total (Rp):</label>
        <input type="text" name="total" id="total" value="18.000" readonly>

        <button type="submit" class="btn-pesan">Pesan Sekarang</button>
      </form>
    </div>
  </section>

  <!-- Script -->
  <script>
    // Harga satuan Jus Alpukat
    const hargaSatuan = 18000;

    // Ambil elemen input
    const jumlahInput = document.getElementById("jumlah");
    const totalInput = document.getElementById("total");

    // Fungsi format rupiah
    function formatRupiah(angka) {
      return angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    // Fungsi hitung total
    function updateTotal() {
      const jumlah = parseInt(jumlahInput.value) || 1;
      const total = hargaSatuan * jumlah;
      totalInput.value = formatRupiah(total);
    }

    // Event listener & inisialisasi awal
    jumlahInput.addEventListener("input", updateTotal);
    updateTotal();
  </script>

  <script src="JS/restoran.js" defer></script>
</body>
</html>
