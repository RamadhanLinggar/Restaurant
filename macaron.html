<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Macaroon</title>
  <link rel="stylesheet" href="CSS/style.css" />
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">
      <a href="index.html"><img src="Gambar/Logo.png" alt="Logo" /></a>
    </div>
    <h1 class="page-title">Macaroon</h1>
  </header>

  <!-- Konten -->
  <section class="food-detail">
    <div class="food-image">
      <img src="Gambar/Macaroon.jpg" alt="Macaroon" />
    </div>
    <div class="food-info">
      <h2>Macaroon</h2>
      <p>
        Macaron lembut dengan tekstur renyah di luar dan halus di dalam.  
        Tersedia dalam varian rasa vanila, cokelat, dan stroberi — camilan elegan  
        yang cocok untuk menemani waktu santai Anda.
      </p>
      <p style="color: red; font-weight: bold">Rp 30.000</p>

      <!-- Form Pemesanan -->
      <form action="pesan.php" method="POST" class="form-pesan">
        <input type="hidden" name="makanan" value="Macaroon Spesial">

        <label>Nama:</label>
        <input type="text" name="nama" placeholder="Nama Anda" required>

        <label>Jumlah:</label>
        <input type="number" name="jumlah" id="jumlah" min="1" value="1" required>

        <label>Total (Rp):</label>
        <input type="text" name="total" id="total" value="30.000" readonly>

        <button type="submit" class="btn-pesan">Pesan Sekarang</button>
      </form>
    </div>
  </section>

  <!-- JavaScript untuk menghitung total otomatis -->
  <script>
    // Harga satuan Macaroon
    const hargaSatuan = 30000;

    // Ambil elemen input
    const jumlahInput = document.getElementById("jumlah");
    const totalInput = document.getElementById("total");

    // Fungsi format rupiah
    function formatRupiah(angka) {
      return angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    // Fungsi update total
    function updateTotal() {
      const jumlah = parseInt(jumlahInput.value) || 1;
      totalInput.value = formatRupiah(hargaSatuan * jumlah);
    }

    // Jalankan saat input berubah
    jumlahInput.addEventListener("input", updateTotal);
    updateTotal();
  </script>

  <script src="JS/restoran.js" defer></script>
</body>
</html>
